# Sound Blaster AE-9 extra capture sources.
# The card's ACP profile only exposes the main-codec microphone; the rear
# line-in is the secondary codec (ALSA hw:Creative,4) and What U Hear is the
# DSP loopback (hw:Creative,2). Expose both as PipeWire sources so desktop
# applications (Audacity, OBS, etc.) can select them.
context.objects = [
    { factory = adapter
      args = {
        factory.name     = api.alsa.pcm.source
        node.name        = "alsa_input.ae9_linein"
        node.description = "Sound Blaster AE-9 Line In"
        media.class      = "Audio/Source"
        api.alsa.path    = "hw:Creative,4"
        audio.format     = "S32LE"
        audio.rate       = 48000
        audio.channels   = 2
        audio.position   = [ FL FR ]
      }
    },
    { factory = adapter
      args = {
        factory.name     = api.alsa.pcm.source
        node.name        = "alsa_input.ae9_wuh"
        node.description = "Sound Blaster AE-9 What U Hear"
        media.class      = "Audio/Source"
        api.alsa.path    = "hw:Creative,2"
        audio.format     = "S32LE"
        audio.rate       = 48000
        audio.channels   = 2
        audio.position   = [ FL FR ]
      }
    }
]
