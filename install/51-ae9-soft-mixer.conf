# Sound Blaster AE-9 (sb-ae9 driver), WirePlumber 0.5+ (conf.d fragment). See the .lua twin for why.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.pci-.*", device.vendor.id = "0x1102", device.product.id = "0x0010" }
    ]
    actions = { update-props = { api.alsa.soft-mixer = true, api.acp.auto-port = false } }
  }
]
