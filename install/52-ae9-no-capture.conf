# Sound Blaster AE-9 (sb-ae9 driver), WirePlumber 0.5+ (conf.d fragment). See the .lua twin for why:
# the card's capture path is not brought up by the driver and opening it hard-locks the machine.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.pci-.*", alsa.mixer_name = "Creative Sound Blaster AE-9" }
    ]
    actions = { update-props = { node.disabled = true } }
  }
]
