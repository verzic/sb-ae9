# Sound Blaster AE-9 (sb-ae9 driver) module options.
# ae9_acm_poll=1 (default): live ACM service -- volume knob, dB display, keepalive.
# ae9_acm_poll=0: initialise the ACM once, then leave it alone (diagnostic baseline).
# ae9_capture=1 + ae9_mic=1: expose and initialise the main codec's capture path (ACM
#   microphone / rear mic-in). The secondary codec's standard ADC behind the rear line-in
#   and S/PDIF in is always exposed. Set ae9_capture=0 to keep the main codec closed.
options snd-hda-codec-ca0132 ae9_acm_poll=1 ae9_capture=1 ae9_mic=1
