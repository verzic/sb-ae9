# Sound Blaster AE-9 (sb-ae9 driver) module options.
# ae9_acm_poll=1 (default): live ACM service -- volume knob, dB display, keepalive.
# ae9_acm_poll=0: initialise the ACM once, then leave it alone (diagnostic baseline).
# ae9_capture=0 (default): no capture (recording) streams on the AE-9 -- the capture path is
#   not brought up and opening it hard-locks the machine. Set ae9_capture=1 only to work on it.
options snd-hda-codec-ca0132 ae9_acm_poll=1
